<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 42px Arial,"Microsoft YaHei",sans-serif;fill:#172033}.h{font:700 28px Arial,"Microsoft YaHei",sans-serif;fill:#172033}
      .t{font:400 23px Arial,"Microsoft YaHei",sans-serif;fill:#334155}.muted{font:400 19px Arial,"Microsoft YaHei",sans-serif;fill:#64748b}
      .card{fill:#fff;stroke:#d8e0eb;stroke-width:3;rx:20}.screen{fill:#111827;stroke:#334155;stroke-width:4;rx:22}.quad{fill:url(#grad);stroke:#facc15;stroke-width:5}
    </style>
    <linearGradient id="grad" x1="0" x2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#e5e7eb"/></linearGradient>
    <linearGradient id="blocker" x1="0" x2="1"><stop offset="0" stop-color="#22c55e"/><stop offset=".5" stop-color="#facc15"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="90" y="88">调试可视化 · Shadow Map 与 Blocker Search</text>
  <rect class="card" x="95" y="175" width="700" height="610"/>
  <text class="h" x="140" y="235">Shadow Map 小窗</text>
  <rect class="screen" x="160" y="290" width="520" height="310"/>
  <circle cx="320" cy="405" r="55" fill="#a5b4fc"/><rect x="265" y="470" width="300" height="55" fill="#475569"/>
  <rect class="quad" x="550" y="508" width="130" height="92"/>
  <text class="t" x="140" y="670">DebugShader.js 绘制右下角四边形</text>
  <text class="muted" x="140" y="710">unpack 深度后灰度显示，黄色边框标识区域</text>

  <rect class="card" x="900" y="175" width="505" height="610"/>
  <text class="h" x="945" y="235">Blocker 搜索密度</text>
  <rect x="980" y="305" width="340" height="80" rx="12" fill="url(#blocker)"/>
  <text class="muted" x="980" y="420">绿色：无 blocker</text>
  <text class="muted" x="1120" y="420">黄色：半遮挡</text>
  <text class="muted" x="1260" y="420">红色：blocker 多</text>
  <text class="t" x="945" y="505">blockerRatio = blockerCount / NUM_SAMPLES</text>
  <text class="t" x="945" y="555">debugColor = mix(green, red, ratio)</text>
  <text class="muted" x="945" y="630">注意：它显示搜索阶段统计，不等于最终阴影亮度</text>
</svg>
